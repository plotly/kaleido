# .github/workflows/publish_pypi.yml
---
name: publish-pypi
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v1.6.0)
        required: true
        type: string
# A second run of the same tag waits for the first run to finish
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/py/
    environment:
      name: pypi
      url: https://pypi.org/p/kaleido
    # Signs this workflow so pypi trusts it
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          # setuptools-git-versioning reads the tags to set the version
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --all-extras --no-sources
      - run: git diff --quiet HEAD || { echo "Working tree dirty"; exit 1; }
      - run: uv build
      - name: Verify that the build matches the tag
        run: |
          expected="${{ inputs.tag }}"
          expected="${expected#v}"
          wheel="dist/kaleido-$expected-py3-none-any.whl"
          sdist="dist/kaleido-$expected.tar.gz"
          if [ ! -f "$wheel" ] || [ ! -f "$sdist" ]; then
            echo "Expected version $expected, but dist/ holds:"
            ls -1 dist/
            exit 1
          fi
          echo "Built $expected from ${{ inputs.tag }}"
      # The github-release job attaches these same files to the release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: src/py/dist/
          if-no-files-found: error
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: src/py/dist
          # A re-run of a tag already on PyPI skips instead of failing
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: pypi-publish
    runs-on: ubuntu-latest
    # Kept apart from pypi-publish so that the OIDC token and the write
    # access to the repository never share a job
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          # Print the lines under "## <tag>" up to the next "## " heading
          awk -v tag="$TAG" '
            $1 == "##" && $2 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $TAG"
            exit 1
          fi
          cat notes.md
      - name: Create the release or add missing files
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run keeps the existing notes and uploads only the
            # files that the release does not hold yet
            echo "Release $TAG exists already"
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for file in dist/*; do
              name=$(basename "$file")
              if printf '%s\n' "$existing" | grep -qxF "$name"; then
                echo "Skip $name, which the release holds already"
              else
                gh release upload "$TAG" "$file"
              fi
            done
          else
            flags=""
            case "$TAG" in *rc*) flags="--prerelease" ;; esac
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag \
              $flags
          fi
